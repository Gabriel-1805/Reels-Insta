<style>
/* comun: colores de marca, escenario, subtítulos, etiquetas, máscara anti-choque */
:root{--navy:#192653;--bg:#0B0F24;--blue:#4B5BFF;--amber:#FFB703;--dim:#8A93B8;--bad:#FF5A5F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#141c44,var(--bg) 70%);font-family:Montserrat,Inter,Arial,sans-serif;color:#fff}
.abs{position:absolute}
#bgclip{left:0;top:0;width:1080px;height:1920px}
#qrclip{left:0;top:0;width:1080px;height:1920px;-webkit-mask-image:linear-gradient(180deg,transparent 430px,#000 530px);mask-image:linear-gradient(180deg,transparent 430px,#000 530px)}
.grid{position:absolute;inset:-480px;background-image:linear-gradient(#ffffff0f 1px,transparent 1px),linear-gradient(90deg,#ffffff0f 1px,transparent 1px);background-size:60px 60px}
#dust,#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.dot{position:absolute;border-radius:50%;background:#9fb0ff}
#cap{position:absolute;left:0;right:0;top:130px;height:290px}
.chunk{position:absolute;left:0;right:0;top:0;text-align:center;font-size:72px;font-weight:600;line-height:1.3;opacity:0;visibility:hidden}
.chunk span{color:var(--dim);display:inline-block;margin:0 10px;position:relative}
.chunk span.key{border:4px solid var(--blue);padding:0 14px;border-radius:6px}
.chunk span.key::before,.chunk span.key::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--blue)}
.chunk span.key::before{left:-12px;top:-12px}.chunk span.key::after{right:-12px;bottom:-12px}
#lbls .lb{position:absolute;left:50%;top:1340px;transform:translateX(-50%);width:max-content;max-width:980px;text-align:center;font-size:40px;font-weight:800;letter-spacing:1.5px;padding:16px 36px;border-radius:44px;background:rgba(11,15,36,.92);border:3px solid #ffffff22;opacity:0;visibility:hidden}
.lbl-line{position:absolute;left:538px;top:1210px;width:4px;height:130px;transform-origin:50% 100%}
.lbl-node{position:absolute;left:531px;top:1201px;width:18px;height:18px;border-radius:50%}
#tilt{position:absolute;left:0;top:0;width:1080px;height:1920px}
#fog{position:absolute;left:0;top:430px;width:1080px;height:640px;background:linear-gradient(180deg,rgba(11,15,36,.92),rgba(11,15,36,0));opacity:0;pointer-events:none}
/* propio del episodio */
#qrwrap{left:127px;top:500px;width:825px;height:825px;background:#fff;border-radius:36px;clip-path:inset(0px)}
#qrsvg{position:absolute;left:66px;top:66px}
.m{fill:#0B0F24}
.patch{left:317px;top:317px;width:190px;height:190px;background:var(--navy);border:6px dashed var(--amber);border-radius:20px;opacity:0}
#beam{left:0;top:0;width:825px;height:10px;background:var(--amber);box-shadow:0 0 30px 8px #FFB70388;opacity:0}
.card{position:absolute;top:1100px;width:300px;height:220px;border-radius:28px;background:var(--navy);border:4px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;opacity:0}
#sheet{position:absolute;left:90px;top:760px;width:900px;height:560px;background:#141a33;border-radius:40px;border:3px solid #ffffff22}
#sheet .h{position:absolute;left:0;right:0;top:36px;text-align:center;font-size:40px;font-weight:600;color:var(--dim)}
.av{position:absolute;top:150px;width:150px;height:150px;border-radius:50%;background:var(--navy);border:4px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800}
#ring{position:absolute;left:105px;top:105px;width:240px;height:240px;border-radius:50%;border:6px solid var(--amber);opacity:0}
#sent{position:absolute;left:150px;right:150px;top:400px;height:100px;border-radius:50px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;opacity:0}
#fol{position:absolute;left:340px;top:560px;width:400px;height:96px;border-radius:48px;background:var(--amber);color:#0B0F24;font-size:44px;font-weight:800}
#fol span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#fol2{opacity:0}
#bk{left:0;top:0;width:825px;height:825px}
#bk .b{position:absolute;width:46px;height:46px;border-radius:9px;background:#4B5BFF;box-shadow:0 0 18px #4B5BFF99;opacity:0}
#mesa{left:-300px;top:1325px;width:1680px;height:900px;background:repeating-linear-gradient(90deg,#ffffff12 0 2px,transparent 2px 100px),linear-gradient(180deg,#1f2a5e 0%,#111838 55%,rgba(11,15,36,0) 100%);transform:perspective(900px) rotateX(58deg);transform-origin:50% 0%;opacity:.9}
#sombra{left:230px;top:1352px;width:620px;height:46px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),rgba(0,0,0,0) 70%)}
#soporte{left:395px;top:1318px;width:290px;height:46px;background:linear-gradient(#2d3a78,#192653);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
#cono{left:0;top:0;pointer-events:none;opacity:0}
#bits{left:0;top:0;width:1080px;height:1920px}
.bit{position:absolute;font-size:34px;font-weight:800;color:#FFB703;opacity:0}
#cel{left:360px;top:1250px;width:360px;height:700px;border-radius:54px;background:#0e1330;border:8px solid #3d4a95;overflow:hidden}
#cel .notch{position:absolute;left:125px;top:14px;width:110px;height:24px;border-radius:12px;background:#05070f}
#vf{position:absolute;left:55px;top:80px;width:250px;height:250px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #4B5BFF}
#dec{position:absolute;left:55px;right:55px;top:350px;height:40px;border-radius:20px;background:#4B5BFF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;opacity:0}
#res{position:absolute;left:35px;right:35px;top:415px}
.row{position:relative;height:62px;margin-bottom:12px;border-radius:16px;background:#192653;border:2px solid #ffffff22;display:flex;align-items:center;padding-left:62px;font-size:24px;font-weight:800;opacity:0}
.row i{position:absolute;left:20px;top:19px;width:22px;height:22px;border-radius:50%;background:#FFB703}
.vfc{position:absolute;display:block;width:34px;height:34px;border:5px solid #FFB703}
.vfc.tl{left:-14px;top:-14px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.vfc.tr{right:-14px;top:-14px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.vfc.bl{left:-14px;bottom:-14px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.vfc.br{right:-14px;bottom:-14px;border-left:0;border-top:0;border-bottom-right-radius:10px}

function etiquetas(LB){
  const lb=document.getElementById('lbls');
  LB.forEach(([a,b,txt,c])=>{
    const col=c==='bad'?'var(--bad)':'var(--amber)';
    const e=document.createElement('div');e.className='lb';e.textContent=txt;e.style.color=col;
    const l=document.createElement('div');l.className='lbl-line';l.style.background=col;
    const n=document.createElement('div');n.className='lbl-node';n.style.background=col;
    lb.append(l,n,e);
    tl.fromTo(l,{scaleY:0},{scaleY:1,duration:.3,ease:'power2.out'},Math.max(0,a-.2))
      .fromTo(n,{scale:0},{scale:1,duration:.2,ease:'back.out(2)'},a+.05)
      .fromTo(e,{autoAlpha:0},{autoAlpha:1,duration:.25},a)
      .to(e,{autoAlpha:0,duration:.2},b).to(l,{scaleY:0,duration:.2},b).to(n,{scale:0,duration:.15},b);
  });
}
