<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba 3D · Así funciona</title>
<style>
:root{--bg:#0B0F24;--blue:#4B5BFF;--amber:#FFB703}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#141c44,var(--bg) 70%);font-family:Montserrat,Inter,Arial,sans-serif;color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0f 1px,transparent 1px),linear-gradient(90deg,#ffffff0f 1px,transparent 1px);background-size:60px 60px}
#three-layer{position:absolute;left:0;top:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(180deg,transparent 430px,#000 530px);mask-image:linear-gradient(180deg,transparent 430px,#000 530px)}
#tag{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:72px;font-weight:800}
#tag span{display:inline-block;border:4px solid var(--blue);padding:0 18px;border-radius:6px;color:var(--amber)}
</style></head><body>
<div data-hf-id="hf-0144" id="stage" data-composition-id="prueba-3d" data-start="0" data-width="1080" data-height="1920">
  <div data-hf-id="hf-uj2p" id="bg" class="grid clip" data-start="0" data-duration="8" data-track-index="0"></div>
  <canvas data-hf-id="hf-i60m" id="three-layer" class="clip" width="1080" height="1920" data-start="0" data-duration="8" data-track-index="1"></canvas>
  <div data-hf-id="hf-n6h7" id="tag" class="clip" data-start="0" data-duration="8" data-track-index="5"><span data-hf-id="hf-093z" id="tagt">3D REAL</span></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
  const tl=gsap.timeline({paused:true});
  tl.from('#tagt',{y:30,opacity:0,duration:.6,ease:'power2.out'},.2);
  tl.to({},{duration:8},0);   // la línea de tiempo raíz debe durar TODA la composición (8 s); si no, el tiempo se corta en la última animación
  window.__timelines=window.__timelines||{};window.__timelines['prueba-3d']=tl;
  </script>
  <script type="module">
  // ===== Escena 3D determinista (adaptador three de HyperFrames: se dibuja EXACTAMENTE el tiempo del evento hf-seek) =====
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
  const W=1080,H=1920,DUR=8;
  const canvas=document.getElementById('three-layer');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setSize(W,H,false);renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(36,W/H,0.1,200);
  camera.setViewOffset(W,H,0,-230,W,H);                      // baja la escena: la franja de subtítulos queda libre
  const rnd=(()=>{let a=7;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u)};
  const backOut=u=>{const c=1.5,t=u-1;return 1+(c+1)*t*t*t+c*t*t};
  // --- QR de 21×21 (mismo reparto que el episodio 1): esquinas y línea de sincronía / datos ---
  const n=21,fin=[],dat=[];
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if((r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7)){const a=r<7?r:r-(n-7),b=c<7?c:c-(n-7);if(a%6===0||b%6===0||(a>1&&a<5&&b>1&&b<5))fin.push([r,c]);}
    else if((r<8&&c<8)||(r<8&&c>=n-8)||(r>=n-8&&c<8)){}
    else if(r===6||c===6){if((r===6&&c%2===0)||(c===6&&r%2===0))fin.push([r,c]);}
    else if(rnd()>.5)dat.push([r,c]);
  }
  const mk=(list,mat,hmaxFn)=>{const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,list.length);m.castShadow=true;m.receiveShadow=true;
    const o=list.map(([r,c])=>({x:c-(n-1)/2,z:r-(n-1)/2,h:hmaxFn(),d:.25+.10*Math.hypot(c-10,r-10)+.45*rnd()}));scene.add(m);return{m,o};};
  const matF=new THREE.MeshStandardMaterial({color:0x4B5BFF,roughness:.32,metalness:.15});
  const matD=new THREE.MeshStandardMaterial({color:0x26357a,roughness:.34,metalness:.25,emissive:0xFFB703,emissiveIntensity:0});
  const F=mk(fin,matF,()=>.7), Dt=mk(dat,matD,()=>.3+.6*rnd());
  const plate=new THREE.Mesh(new THREE.BoxGeometry(n+4,.4,n+4),new THREE.MeshStandardMaterial({color:0xe9ecf5,roughness:.55,metalness:0}));plate.position.y=-.2;plate.receiveShadow=true;scene.add(plate);
  // --- luces ---
  scene.add(new THREE.HemisphereLight(0xb4c0ff,0x0b0f24,1.1));
  const sun=new THREE.DirectionalLight(0xfff1d6,3.2);sun.position.set(-9,16,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:50});sun.shadow.bias=-.0006;scene.add(sun);
  const rim=new THREE.DirectionalLight(0x4B5BFF,1.4);rim.position.set(11,6,-11);scene.add(rim);
  // --- partículas con semilla ---
  const NP=320,pp=new Float32Array(NP*3),p0=[];
  for(let i=0;i<NP;i++)p0.push([(rnd()-.5)*34,rnd()*16,(rnd()-.5)*34,.25+.35*rnd()]);
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fb0ff,size:.16,transparent:true,opacity:.75,depthWrite:false})));
  const dummy=new THREE.Object3D(),navy=new THREE.Color(0x26357a),amber=new THREE.Color(0xFFB703);
  function renderAt(t){
    t=clamp(t,0,DUR);
    for(const G of[F,Dt]){G.o.forEach((m,i)=>{const u=clamp((t-m.d)/.9),e=u<=0?0:backOut(u),h=Math.max(.001,m.h*e);dummy.position.set(m.x,h/2,m.z);dummy.scale.set(.86,h,.86);dummy.updateMatrix();G.m.setMatrixAt(i,dummy.matrix);});G.m.instanceMatrix.needsUpdate=true;}
    const g=sm(4.3,5.6,t);matD.color.copy(navy).lerp(amber,g);matD.emissiveIntensity=.22*g;
    for(let i=0;i<NP;i++){const q=p0[i];pp[i*3]=q[0];pp[i*3+1]=(q[1]+t*q[3])%16;pp[i*3+2]=q[2];}pg.attributes.position.needsUpdate=true;
    // cámara: órbita lenta, acercamiento y entrada final sobre el código
    const az=THREE.MathUtils.degToRad(-32+56*sm(0,DUR,t)), el=THREE.MathUtils.degToRad(54-26*sm(5.4,DUR,t));
    const d=t<5.4?86-54*sm(0,5.4,t):32-20*sm(5.4,DUR,t);
    const tx=-1.5*(1-sm(0,DUR,t)),tz=1.2*sm(5.4,DUR,t);
    camera.position.set(tx+d*Math.cos(el)*Math.sin(az),.4+d*Math.sin(el),tz+d*Math.cos(el)*Math.cos(az));camera.lookAt(tx,.3,tz);
    renderer.render(scene,camera);
  }
  window.addEventListener('hf-seek',e=>renderAt(e.detail.time));
  renderAt(window.__hfThreeTime||0);
  </script>
</div></body></html>
