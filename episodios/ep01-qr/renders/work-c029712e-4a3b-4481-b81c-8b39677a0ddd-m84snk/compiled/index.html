<style>
/* comun: colores de marca, escenario, subtítulos, etiquetas, máscara anti-choque */
:root{--navy:#192653;--bg:#0B0F24;--blue:#4B5BFF;--amber:#FFB703;--dim:#8A93B8;--bad:#FF5A5F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#141c44,var(--bg) 70%);font-family:Montserrat,Inter,Arial,sans-serif;color:#fff}
.abs{position:absolute}
#bgclip{left:0;top:0;width:1080px;height:1920px}
#qrclip{left:0;top:0;width:1080px;height:1920px;-webkit-mask-image:linear-gradient(180deg,transparent 430px,#000 530px);mask-image:linear-gradient(180deg,transparent 430px,#000 530px)}
.grid{position:absolute;inset:-480px;background-image:linear-gradient(#ffffff0f 1px,transparent 1px),linear-gradient(90deg,#ffffff0f 1px,transparent 1px);background-size:60px 60px}
#dust,#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.dot{position:absolute;border-radius:50%;background:#9fb0ff}
#cap{position:absolute;left:0;right:0;top:130px;height:290px}
.chunk{position:absolute;left:0;right:0;top:0;text-align:center;font-size:72px;font-weight:600;line-height:1.3;opacity:0;visibility:hidden}
.chunk span{color:var(--dim);display:inline-block;margin:0 10px;position:relative}
.chunk span.key{border:4px solid var(--blue);padding:0 14px;border-radius:6px}
.chunk span.key::before,.chunk span.key::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--blue)}
.chunk span.key::before{left:-12px;top:-12px}.chunk span.key::after{right:-12px;bottom:-12px}
#lbls .lb{position:absolute;left:50%;top:1340px;transform:translateX(-50%);width:max-content;max-width:980px;text-align:center;font-size:40px;font-weight:800;letter-spacing:1.5px;padding:16px 36px;border-radius:44px;background:rgba(11,15,36,.92);border:3px solid #ffffff22;opacity:0;visibility:hidden}
.lbl-line{position:absolute;left:538px;top:1210px;width:4px;height:130px;transform-origin:50% 100%}
.lbl-node{position:absolute;left:531px;top:1201px;width:18px;height:18px;border-radius:50%}
#tilt{position:absolute;left:0;top:0;width:1080px;height:1920px}
#fog{position:absolute;left:0;top:430px;width:1080px;height:640px;background:linear-gradient(180deg,rgba(11,15,36,.92),rgba(11,15,36,0));opacity:0;pointer-events:none}
/* comun: escena de cierre (perfil de la cuenta + hoja de compartir). Se reutiliza en todos los episodios */
#cierre{position:absolute;left:0;top:0;width:1080px;height:1920px}
#mock{position:absolute;left:90px;top:470px;width:900px;height:960px;border-radius:70px;border:6px solid #2a3566;background:linear-gradient(180deg,#0e1330,#090c1f);overflow:hidden}
.gridm{position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:50px 50px}
#rail{position:absolute;left:800px;top:70px;width:70px}
#rail svg{display:block;width:56px;height:56px;margin:0 auto 34px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#perfil{position:absolute;left:40px;top:740px;width:820px;height:110px}
#avlogo{position:absolute;left:0;top:5px;width:100px;height:100px;border-radius:50%;background-color:#fff;background-size:cover;background-position:center;border:3px solid #4B5BFF}
#user{position:absolute;left:122px;top:30px;font-size:34px;font-weight:800;letter-spacing:.3px}
#seguir{position:absolute;left:520px;top:24px;width:170px;height:56px;border-radius:14px;border:3px solid #fff;font-size:28px;font-weight:800}
#seguir span,#enviar span{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#sig2,#env2{opacity:0}
#cap2{position:absolute;left:40px;top:860px;width:700px;font-size:28px;line-height:1.3;color:#cfd5ee}
#hoja{position:absolute;left:0;top:330px;width:900px;height:630px;border-radius:50px 50px 0 0;background:#1d2238;border-top:3px solid #ffffff1f}
#hoja .asa{position:absolute;left:390px;top:16px;width:120px;height:8px;border-radius:4px;background:#555a75}
#busca{position:absolute;left:36px;top:48px;width:828px;height:64px;border-radius:16px;background:#2b3148;color:#8f95b3;font-size:28px;padding:15px 24px 0 78px}
#busca svg{position:absolute;left:26px;top:16px;width:32px;height:32px;fill:none;stroke:#cfd5ee;stroke-width:2.4;stroke-linecap:round}
.amigo{position:absolute;top:150px;width:200px;text-align:center}
.amigo .circ{position:relative;width:140px;height:140px;margin:0 auto;border-radius:50%;overflow:hidden;background:#2b3148}
.amigo b{display:block;margin-top:14px;font-size:28px;font-weight:600}
#chk{position:absolute;left:128px;top:100px;width:44px;height:44px;border-radius:50%;background:#4B5BFF;border:4px solid #1d2238;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;opacity:0}
#msg{position:absolute;left:36px;top:370px;width:828px;height:70px;border-bottom:2px solid #353b57;color:#8f95b3;font-size:28px;padding:18px 0 0 12px}
#enviar{position:absolute;left:36px;top:470px;width:828px;height:96px;border-radius:22px;background:#4B5BFF;font-size:36px;font-weight:800}
.rg{position:absolute;width:130px;height:130px;border-radius:50%;border:6px solid #FFB703;opacity:0}
#ringS{left:580px;top:727px}#ringI{left:770px;top:213px}#ringA{left:47px;top:485px}#ringE{left:385px;top:783px}
/* propio del episodio */
#qrwrap{left:127px;top:500px;width:825px;height:825px;background:#fff;border-radius:36px;clip-path:inset(0px)}
#qrsvg{position:absolute;left:66px;top:66px}
.m{fill:#0B0F24}
.patch{left:317px;top:317px;width:190px;height:190px;background:var(--navy);border:6px dashed var(--amber);border-radius:20px;opacity:0}
#beam{left:0;top:0;width:825px;height:10px;background:var(--amber);box-shadow:0 0 30px 8px #FFB70388;opacity:0}
.card{position:absolute;top:1100px;width:300px;height:220px;border-radius:28px;background:var(--navy);border:4px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;opacity:0}
#bk{left:0;top:0;width:825px;height:825px}
#bk .b{position:absolute;width:46px;height:46px;border-radius:9px;background:#4B5BFF;box-shadow:0 0 18px #4B5BFF99;opacity:0}
#mesa{left:-300px;top:1325px;width:1680px;height:900px;background:repeating-linear-gradient(90deg,#ffffff12 0 2px,transparent 2px 100px),linear-gradient(180deg,#1f2a5e 0%,#111838 55%,rgba(11,15,36,0) 100%);transform:perspective(900px) rotateX(58deg);transform-origin:50% 0%;opacity:.9}
#sombra{left:230px;top:1352px;width:620px;height:46px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),rgba(0,0,0,0) 70%)}
#soporte{left:395px;top:1318px;width:290px;height:46px;background:linear-gradient(#2d3a78,#192653);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
#cono{left:0;top:0;pointer-events:none;opacity:0}
#bits{left:0;top:0;width:1080px;height:1920px}
.bit{position:absolute;font-size:34px;font-weight:800;color:#FFB703;opacity:0}
#cel{left:360px;top:1250px;width:360px;height:700px;border-radius:54px;background:#0e1330;border:8px solid #3d4a95;overflow:hidden}
#cel .notch{position:absolute;left:125px;top:14px;width:110px;height:24px;border-radius:12px;background:#05070f}
#vf{position:absolute;left:55px;top:80px;width:250px;height:250px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #4B5BFF}
#dec{position:absolute;left:55px;right:55px;top:350px;height:40px;border-radius:20px;background:#4B5BFF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;opacity:0}
#res{position:absolute;left:35px;right:35px;top:415px}
.row{position:relative;height:62px;margin-bottom:12px;border-radius:16px;background:#192653;border:2px solid #ffffff22;display:flex;align-items:center;padding-left:62px;font-size:24px;font-weight:800;opacity:0}
.row i{position:absolute;left:20px;top:19px;width:22px;height:22px;border-radius:50%;background:#FFB703}
.vfc{position:absolute;display:block;width:34px;height:34px;border:5px solid #FFB703}
.vfc.tl{left:-14px;top:-14px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.vfc.tr{right:-14px;top:-14px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.vfc.bl{left:-14px;bottom:-14px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.vfc.br{right:-14px;bottom:-14px;border-left:0;border-top:0;border-bottom-right-radius:10px}

function etiquetas(LB){
  const lb=document.getElementById('lbls');
  LB.forEach(([a,b,txt,c])=>{
    const col=c==='bad'?'var(--bad)':'var(--amber)';
    const e=document.createElement('div');e.className='lb';e.textContent=txt;e.style.color=col;
    const l=document.createElement('div');l.className='lbl-line';l.style.background=col;
    const n=document.createElement('div');n.className='lbl-node';n.style.background=col;
    lb.append(l,n,e);
    tl.fromTo(l,{scaleY:0},{scaleY:1,duration:.3,ease:'power2.out'},Math.max(0,a-.2))
      .fromTo(n,{scale:0},{scale:1,duration:.2,ease:'back.out(2)'},a+.05)
      .fromTo(e,{autoAlpha:0},{autoAlpha:1,duration:.25},a)
      .to(e,{autoAlpha:0,duration:.2},b).to(l,{scaleY:0,duration:.2},b).to(n,{scale:0,duration:.15},b);
  });
}

   [CL[9][0],CL[10][1],'RAYADO · SUCIO · TAPADO'],[CL[11][0],CL[11][1],'✓ TODAVÍA SE LEE'],[CL[13][0],CL[13][1],'✕ NO ES INDESTRUCTIBLE','bad'],
   [C(14,.05),C(14,.55),'L 7 % · M 15 % · Q 25 % · H 30 %'],[C(14,.66),CL[14][1],'✕ ESQUINA DAÑADA','bad'],
   [C(18,.5),CL[18][1],'EN SEGUNDOS'],[CL[19][0],CL[19][1],'SIN ENTENDER CADA CUADRADO'],
   [CL[20][0],CL[20][1],'NO ES MAGIA'],[C(21,.1),CL[21][1],'INFORMACIÓN + RESPALDO = ✓']]);
  // ---- escenas ----
  tl.from(W,{scale:.6,autoAlpha:0,duration:.8,ease:'power2.out'},0);
  tl.to('#scr',{opacity:1,duration:.4},.9).to('#stn',{opacity:.8,duration:.4},1.5).to('#scr,#stn',{opacity:0,duration:.4},T(1,.55));   // 0 daño
  tl.to('.m rect',{opacity:.12,duration:.3},T(2,0)).to('.m rect',{opacity:1,duration:.01,stagger:(.58*(SC[2][1]-SC[2][0]))/NR},T(2,.12));   // 2
  tl.to('#d rect,#t rect',{opacity:.15,duration:.4},T(3,.2)).to('#hl',{opacity:1,duration:.5},T(3,.22)).to('#hl',{opacity:0,duration:.3},T(3,.97)).to('#d rect,#t rect',{opacity:1,duration:.4},T(3,.7));   // 3
  tl.to('#f rect',{opacity:.15,duration:.4},T(4,0)).to('#d',{fill:'#FFB703',duration:.4},T(4,.05)).to('#d rect:nth-child(3n)',{fill:'#4B5BFF',duration:.3,stagger:.02},T(4,.45));   // 4
  tl.to('#d',{fill:'#0B0F24',duration:.3},T(5,0)).to('#d rect:nth-child(3n)',{fill:'#0B0F24',duration:.3},T(5,0)).to('#f rect',{opacity:1,duration:.3},T(5,0));   // 5
  tl.to('#scr',{opacity:1,duration:.35},CL[9][0]+.3).to('#stn',{opacity:.8,duration:.35},CL[10][0]+.1).to('#p1',{opacity:1,duration:.4},C(10,.55))
    .to('#scr,#stn,#p1',{opacity:0,duration:.35},CL[12][0]).set('#p1',{x:-237,y:-237,scale:1.421},CL[12][0]+.5)
    .to('#p1',{opacity:1,duration:.4},C(14,.66)).to('#p1',{opacity:0,duration:.4},CL[14][1]);
  tl.to('#beam',{opacity:1,duration:.2},C(18,.1)).to('#beam',{y:815,duration:1.5,ease:'power1.inOut'},C(18,.1)+.1)   // 7 haz de escaneo
    .to('#beam',{y:0,duration:1.5,ease:'power1.inOut'},CL[19][0]).to('#beam',{opacity:0,duration:.3},CL[19][0]+1.6);
  tl.to('#d',{fill:'#FFB703',duration:.4},C(21,.15)).to('#d rect:nth-child(3n)',{fill:'#4B5BFF',duration:.3,stagger:.02},C(21,.3));   // 8

  // ================= FASE 2 =================
  // perspectiva: el QR llega torcido, las esquinas lo «enganchan» y se endereza; luego sigue inclinado en 3D
  const t3=T(3,.7);
  enganchar(t3,{rx:36,ry:-10,rz:12});
  tilt(T(5,0),1.2,{rx:0,ry:0,rz:0});
  tilt(T(7,0),1.3,{rx:34,ry:8,rz:0});
  tilt(T(8,0),1.2,{rx:0,ry:0,rz:0});
  // brillo en los módulos de datos (copia desenfocada debajo)
  tl.to('#dglow',{opacity:.9,duration:.5},T(4,.05)).to('#dglow',{opacity:0,duration:.3},T(5,0)).to('#dglow',{opacity:.9,duration:.5},C(21,.15));
  // bloques de respaldo que llegan a reconstruir la zona tapada
  const bk=document.createElement('div');bk.id='bk';bk.className='abs';document.getElementById('qrwrap').appendChild(bk);
  for(let i=0;i<9;i++){const q=document.createElement('div');q.className='b';q.style.left=(331+(i%3)*58)+'px';q.style.top=(331+Math.floor(i/3)*58)+'px';bk.appendChild(q);}
  tl.fromTo('#bk .b',{x:i=>([-1,0,1][i%3])*260,y:i=>([-1,0,1][Math.floor(i/3)])*260,scale:.3,opacity:0},{x:0,y:0,scale:1,opacity:1,duration:.55,ease:'back.out(1.5)',stagger:.06},CL[11][0])
    .to('#bk .b',{opacity:0,duration:.3},CL[12][0]);

  // ================= FASE 2b: celular que escanea, escenario y zoom a la pantalla =================
  document.getElementById('vfqr').innerHTML=`<svg viewBox="0 0 693 693" width="200" height="200"><g fill="#0B0F24">${f}${t}${d}</g></svg>`;
  tl.set('#cel',{transformPerspective:1000},0);
  // S3: el celular entra desde abajo apuntando al QR; el haz sale de su cámara y barre el código
  tl.fromTo('#cel',{y:900,rotationZ:12},{y:0,rotationZ:0,duration:1.1,ease:'power3.out'},C(5,0)-.2);
  const ts=C(5,.35);
  tl.to('#cono',{opacity:1,duration:.3},ts).to('#cono',{opacity:0,duration:.3},T(3,.19));
  tl.to('#beam',{opacity:1,duration:.2},ts).to('#beam',{y:815,duration:1.3,ease:'power1.inOut'},ts+.1).to('#beam',{opacity:0,duration:.2},ts+1.4).to('#beam',{y:0,duration:.01},ts+1.65);
  // vista amplia: el haz vuelve suave y los bits viajan del QR al celular
  const tw=T(3,.7);
  tl.to('#cono',{opacity:.7,duration:.4},tw).to('#cono',{opacity:0,duration:.3},T(3,.96));
  const bits=document.getElementById('bits');
  for(let i=0;i<8;i++){const q=document.createElement('div');q.className='bit';q.textContent=i%2?'1':'0';q.style.left=(250+i*80)+'px';q.style.top='1040px';bits.appendChild(q);}
  tl.fromTo('#bits .bit',{y:0,x:0,opacity:0},{y:i=>216+(i%3)*10,x:i=>640-(250+i*80),opacity:1,duration:.7,stagger:.12,ease:'power1.in'},tw+.2)
    .to('#bits .bit',{opacity:0,duration:.25},T(3,.97));
  // el celular sale (se ve siempre su pantalla: la cámara trasera apunta al QR)
  tl.to('#cel',{y:900,duration:.8,ease:'power2.in'},T(3,.97));
  // S6: vuelve con la pantalla al frente y la cámara se mete en ella: lo que lee
  tl.fromTo('#cel',{y:900},{y:-370,duration:1.1,ease:'power3.out'},T(6,0));
  cam(T(6,0),1.5,focus(540,1230,2.7),'power3.inOut'); blur(T(6,0)+.1,.9);
  cam(T(6,0)+1.5,SC[6][1]-T(6,0)-1.7,focus(540,1235,2.9),'none');
  tl.fromTo('#dec',{opacity:0,y:20},{opacity:1,y:0,duration:.4},C(15,.25))
    .fromTo('.row:nth-child(1)',{opacity:0,y:30},{opacity:1,y:0,duration:.45},CL[16][0])
    .fromTo('.row:nth-child(2)',{opacity:0,y:30},{opacity:1,y:0,duration:.45},CL[17][0])
    .fromTo('.row:nth-child(3)',{opacity:0,y:30},{opacity:1,y:0,duration:.45},C(17,.55));
  tl.to('#cel',{y:900,duration:1.0,ease:'power2.in'},T(7,0));
  // el visor «engancha» el código: las cuatro esquinas de enfoque se cierran
  tl.fromTo('.vfc',{scale:1.6,opacity:0},{scale:1,opacity:1,duration:.35,ease:'back.out(2)',stagger:.06},ts+.9);

// comun: cierre. «Sígueme» → aparece el perfil; «envíaselo» → hoja de compartir; «amigo» → se elige un contacto; después «Enviado».
// Los tiempos salen de las palabras reales de CAPS (si no las encuentra, usa valores de reserva).
(()=>{
  const limpia=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W/g,'').toLowerCase();
  const cuando=(re,def)=>{const x=CAPS.find(c=>re.test(limpia(c.w)));return x?x.s:def;};
  const tS=cuando(/^(sigueme|seguime)/,CTA+.1), tE0=cuando(/^enviaselo/,tS+1.2), tA0=cuando(/^amigo/,tE0+1.5);
  // si la voz va muy rápida, cada paso espera a que el anterior se vea (≥ 1 s para el perfil, ≥ 0,9 s para elegir contacto)
  const tE=Math.max(tE0,tS+1.3), tA=Math.max(tA0,tE+1.05), tSend=Math.min(tA+.9,TOT-1.0);
  // avatares originales, alternando chico / chica
  const AV=[['chico','#f2c9a5','#2b1b14','#4B5BFF','Mati'],['chica','#8d5a3b','#1c1c1c','#FFB703','Sofi'],['chico','#e0ac82','#6b3f1d','#2fb8a3','Nacho'],['chica','#f2c9a5','#a0522d','#e0556f','Vale']];
  const cara=(t,piel,pelo,camisa)=>`<svg viewBox="0 0 100 100" width="140" height="140"><circle cx="50" cy="50" r="50" fill="#2b3148"/>${t==='chica'?`<path d="M20 78 Q14 26 50 20 Q86 26 80 78 Z" fill="${pelo}"/>`:''}<ellipse cx="50" cy="98" rx="34" ry="26" fill="${camisa}"/><rect x="43" y="60" width="14" height="14" rx="5" fill="${piel}"/><circle cx="50" cy="46" r="21" fill="${piel}"/>${t==='chica'?`<path d="M29 44 Q50 14 71 44 Q50 34 29 44Z" fill="${pelo}"/>`:`<path d="M28 44 Q28 22 50 22 Q72 22 72 44 Q62 34 50 36 Q38 34 28 44Z" fill="${pelo}"/>`}<circle cx="43" cy="48" r="2.6" fill="#1a1410"/><circle cx="57" cy="48" r="2.6" fill="#1a1410"/><path d="M43 56 Q50 62 57 56" stroke="#1a1410" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
  const am=document.getElementById('amigos');
  AV.forEach((a,i)=>{const d=document.createElement('div');d.className='amigo';d.style.left=(12+i*225)+'px';d.innerHTML=`<div class="circ">${cara(a[0],a[1],a[2],a[3])}</div><b>${a[4]}</b>`+(i===0?'<div id="chk">✓</div>':'');am.appendChild(d);});
  const ring=(id,t0)=>tl.fromTo(id,{scale:.2,opacity:1},{scale:1.4,opacity:0,duration:.6},t0);
  // llegada: viene del zoom-through de la escena anterior
  tl.from('#mock',{scale:1.45,opacity:0,filter:'blur(10px)',duration:.8,ease:'power3.out'},CTA);
  // «Sígueme»: aparece el perfil y el botón pasa a «Siguiendo»
  tl.from('#perfil',{y:40,opacity:0,duration:.5,ease:'back.out(1.6)'},Math.max(CTA+.2,tS));
  ring('#ringS',tS+.55);
  tl.to('#sig1',{opacity:0,duration:.15},tS+.6).to('#sig2',{opacity:1,duration:.15},tS+.6).to('#seguir',{backgroundColor:'#3a3f5c',borderColor:'#3a3f5c',duration:.2},tS+.6);
  // «envíaselo»: se toca el icono de compartir y sube la hoja
  ring('#ringI',tE-.35);
  tl.to('#ico3',{scale:1.3,stroke:'#FFB703',duration:.2},tE-.35).to('#ico3',{scale:1,duration:.2},tE-.15);
  tl.fromTo('#hoja',{y:700},{y:0,duration:.6,ease:'power3.out'},tE-.15).from('.amigo',{scale:0,duration:.3,stagger:.08},tE+.35);
  // «amigo»: se elige el primer contacto; luego Enviar → Enviado
  ring('#ringA',tA);
  tl.to('#chk',{opacity:1,duration:.25},tA+.15);
  ring('#ringE',tSend);
  tl.to('#env1',{opacity:0,duration:.15},tSend+.3).to('#env2',{opacity:1,duration:.15},tSend+.3).to('#enviar',{backgroundColor:'#3a3f5c',duration:.2},tSend+.3);
})();

  window.__timelines=window.__timelines||{};window.__timelines['qr-ep01']=tl;
